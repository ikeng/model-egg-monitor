# ai-egg-monitor 配置文件
# 新增厂商或调整关键词，只需修改本文件，无需改动代码。
#
# 说明：下列所有 url 均已实测「可访问 + 正文非空 / feed 有条目」，
# 403 / 纯 JS 渲染（正文为空）/ 404 的页面一律未收录，
# 避免每次运行都产生大量「失败源」噪音。

# ---------------- 全局配置 ----------------
site:
  base_url: https://ikeng.github.io/model-egg-monitor
  title: 赛博鸡蛋
  subtitle: 大模型厂商活动监控
  description: 每日两次监控大模型厂商活动，提供 Atom / JSON Feed 订阅
  language: zh-CN
  author: ai-egg-monitor
  max_items: 100
  fetch_workers: 8        # 并发抓取线程数（源较多，串行会超出 Actions 超时）

# 默认关键词。命中任一关键词即视为"赛博鸡蛋"候选。
# source 没有单独 keywords 时使用此列表。
default_keywords:
  - 免费
  - 赠金
  - 额度
  - 算力券
  - 优惠
  - 限时
  - 学生
  - 内测
  - 邀请
  - 降价
  - 折扣
  - 会员
  - free
  - credit
  - trial
  - promo
  - discount
  - giveaway

# 媒体 / 社区类来源用的收窄关键词。
# 泛媒体一旦只用「免费」匹配会命中大量无关新闻，这里只认"福利语义"的短语。
media_keywords: &media_kw
  - 免费额度
  - 免费 API
  - 免费调用
  - 免费试用
  - 免费领取
  - 限时免费
  - 免费 token
  - 免费 tokens
  - 赠金
  - 算力券
  - 代金券
  - 优惠券
  - 学生认证
  - 内测资格
  - 邀请码
  - 降价
  - 折扣
  - free credit
  - free tier
  - free trial
  - free API
  - free tokens
  - giveaway

