name: egg-monitor

on:
  schedule:
    # 北京时间 10:00 和 18:00 = UTC 02:00 / 10:00
    - cron: '0 2,10 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: egg-monitor-run
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run monitor
        run: python scripts/main.py

      - name: Commit updates
        run: |
          git config user.name  github-actions
          git config user.email github-actions@github.com
          git add docs/ scripts/state/
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore: update eggs ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push
